spring.application.name=web-test


# ============================================
# 数据库连接配置
# 通过环境变量设置敏感信息，避免硬编码泄露
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/testdata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#配置mybatis的日志输出
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#开启驼峰命名法
mybatis.configuration.map-underscore-to-camel-case=true

#文件上传大小限制 (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# 百度OCR API 配置
# 请设置环境变量或在 application-local.properties 中覆盖
# ============================================
baidu.ocr.api-key=${BAIDU_OCR_API_KEY:}
baidu.ocr.secret-key=${BAIDU_OCR_SECRET_KEY:}

# ============================================
# JWT 配置（生产环境请使用强随机密钥）
# ============================================
jwt.secret=${JWT_SECRET:hspyx-secret-key-for-jwt-token-generation-must-be-long-enough}
jwt.expiration=86400000